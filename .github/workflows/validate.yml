name: Validate Kubernetes configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  setup-wizard:
    name: Setup wizard (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install setup dependencies for offline tests
        run: python -m pip install -r infrastructure/requirements.txt -r requirements-dev.txt
      - name: Install native Windows GPG
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 5
        run: |
          choco install gnupg --version=2.5.21 --yes --no-progress --execution-timeout=180
          for directory in 'C:/Program Files/GnuPG/bin' 'C:/Program Files (x86)/GnuPG/bin'; do
            if [ -f "$directory/gpg.exe" ]; then
              echo "$directory" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo 'Native GnuPG installation not found' >&2
          exit 1
      - name: Check GPG installation
        run: gpg --version
      - name: Test setup wizard without credentials
        run: python -m unittest discover -s tests -p "test_setup*.py" -v
      - name: Check standalone entry points
        run: |
          python scripts/setup_environment.py --help
          python scripts/save_tokens.py --help

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt -r infrastructure/requirements.txt
          mkdir -p "$RUNNER_TEMP/validation-bin"
          cd "$RUNNER_TEMP/validation-bin"
          curl -fsSLO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz' | sha256sum --check
          tar --no-same-owner -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          chmod +x kubectl kubeconform
          echo "$RUNNER_TEMP/validation-bin" >> "$GITHUB_PATH"
      - name: Render and check deployment safety
        run: |
          actionlint
          python -m unittest discover -s tests -v
          kubectl kustomize k8s/base > "$RUNNER_TEMP/private.yaml"
          kubectl kustomize k8s/overlays/production > "$RUNNER_TEMP/public.yaml"
          kubectl kustomize k8s/overlays/cloudflare > "$RUNNER_TEMP/cloudflare.yaml"
      - name: Validate Kubernetes schemas
        run: >-
          kubeconform -strict -summary -kubernetes-version 1.35.0
          "$RUNNER_TEMP/private.yaml" "$RUNNER_TEMP/public.yaml" "$RUNNER_TEMP/cloudflare.yaml"
          k8s/maintenance/pod.yaml
