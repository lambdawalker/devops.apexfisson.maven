apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reposilite-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: reposilite-https-redirect@kubernetescrd
spec:
  ingressClassName: reposilite-edge
  rules:
    - host: maven.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reposilite
                port:
                  number: 8080
